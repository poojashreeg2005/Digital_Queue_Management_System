
{% extends "base.html" %}

{% block title %}Student Registration | QueueFlow AI{% endblock %}

{% block content %}

<section class="page">
    <div class="auth-card">

        <span class="role-label">STUDENT ACCOUNT</span>

        <h1>Create your account</h1>
        <p class="muted">Register to book and manage your campus service tokens.</p>

        <form method="POST">

            <div class="field">
                <label>Full Name</label>
                <input type="text" name="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="field">
                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="field">
                <label>Phone Number</label>
                <input type="tel" name="phone"
                       placeholder="Enter your phone number">
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Minimum 8 characters"
                       minlength="8" required>
            </div>

            <div class="field">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password"
                       placeholder="Re-enter your password" required>
            </div>

            <button type="submit" class="primary-btn">
                Create Account →
            </button>

        </form>

        <div class="auth-link">
            Already registered?
            <a href="{{ url_for('auth.student_login') }}">Login</a>
        </div>

    </div>
</section>

{% endblock %}
